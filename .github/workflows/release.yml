name: Gerar instalador

# Botão "Run workflow" na aba Actions (ou tag v*). Usa a versão do package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar UCBR-Setup.exe
        run: node ferramentas/build.js
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
      - name: Publicar na página de Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --target "$GITHUB_SHA" --title "U.C.B.R ${V#v}" --notes "Versão ${V#v} do app U.C.B.R para Windows. Baixe UCBR-Setup.exe."
          gh release upload "$V" dist/UCBR-Setup.exe dist/UCBR-Setup.exe.blockmap dist/latest.yml --clobber
