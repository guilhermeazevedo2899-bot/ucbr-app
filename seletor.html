<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Transmitir tela</title>
<style>
:root{--bg0:#0b0c0f;--bg1:#121419;--bg2:#191c22;--bg3:#222630;--line:#2c313c;--txt:#f5f5f5;--txt2:#9299a5;--ac:#ff8a24;--ac2:#ff6b00}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{-webkit-font-smoothing:antialiased;background:radial-gradient(900px 400px at 10% -10%,rgba(255,138,36,.12),transparent 60%),var(--bg0);color:var(--txt);font:14px "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:16px 20px 8px}
header img{width:36px;height:36px;border-radius:8px}
h1{margin:0;font:400 22px Impact,"Arial Narrow",sans-serif;letter-spacing:.5px;text-transform:uppercase}
h1 b{color:var(--ac);font-weight:400}
.abas{display:flex;gap:6px;padding:4px 20px 10px}
.abas button{background:var(--bg2);color:var(--txt2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font:600 13px inherit;cursor:pointer}
.abas button.on{color:#1a0d04;background:var(--ac);border-color:var(--ac);box-shadow:0 0 14px rgba(255,138,36,.35)}
main{flex:1;overflow:auto;padding:4px 20px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
.f{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:8px;opacity:0;transform:translateY(6px);animation:entra .28s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*35ms);cursor:pointer;text-align:left;color:inherit;font:inherit;transition:border-color .15s,box-shadow .15s,scale .1s}
@keyframes entra{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.f{animation:none;opacity:1;transform:none}}
.f:hover{border-color:rgba(255,138,36,.6)}.f:active{scale:.98}
.f.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 18px rgba(255,138,36,.3)}
.f .im{aspect-ratio:16/9;background:#000;border-radius:7px;outline:1px solid rgba(255,255,255,.06);outline-offset:-1px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.f .im img{max-width:100%;max-height:100%}
.f .n{display:flex;gap:6px;align-items:center;margin-top:7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .n img{width:16px;height:16px;flex:none}.f .n span{overflow:hidden;text-overflow:ellipsis}
.f.dayz .n span::after{content:"DayZ";margin-left:6px;font-size:10px;font-weight:700;color:#1a0d04;background:var(--ac);border-radius:4px;padding:1px 5px}
footer{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line);background:var(--bg1)}
footer label{display:flex;gap:8px;align-items:center;color:var(--txt2);cursor:pointer}
footer input{accent-color:var(--ac);width:16px;height:16px}
.sp{flex:1}
.btn{border:0;border-radius:8px;padding:10px 18px;min-height:40px;transition:filter .15s,scale .1s;font:700 14px inherit;cursor:pointer}
.btn.gh{background:var(--bg3);color:var(--txt)}
.btn.ok{background:linear-gradient(180deg,var(--ac),var(--ac2));color:#1a0d04}
.btn:active:not(:disabled){scale:.97}.btn.ok:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.f:focus-visible,.abas button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.vazio{color:var(--txt2);grid-column:1/-1;padding:30px;text-align:center}
</style></head>
<body>
<header><img src="build/icon.png" alt=""><h1>Transmitir <b>tela</b></h1></header>
<div class="abas"><button data-t="win" class="on">Janelas</button><button data-t="tela">Tela inteira</button></div>
<main id="lista"><div class="vazio">Carregando…</div></main>
<footer>
  <label><input type="checkbox" id="som" checked> Transmitir com o som do PC</label>
  <span class="sp"></span>
  <button class="btn gh" id="cancelar">Cancelar</button>
  <button class="btn ok" id="ok" disabled>Transmitir</button>
</footer>
<script>
let L = [], aba = 'win', sel = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function render() {
  const v = L.filter(f => aba === 'tela' ? f.tela : !f.tela);
  $('#lista').innerHTML = v.length ? v.map((f, i) => `<button style="--i:${i}" class="f ${f.id === sel ? 'sel' : ''} ${/dayz/i.test(f.nome) ? 'dayz' : ''}" data-id="${esc(f.id)}"><div class="im"><img src="${f.img}" alt=""></div><div class="n">${f.ico ? `<img src="${f.ico}" alt="">` : ''}<span>${esc(f.tela ? f.nome.replace(/^Screen/, 'Tela') : f.nome)}</span></div></button>`).join('') : '<div class="vazio">Nada para mostrar aqui.</div>';
  $('#ok').disabled = !sel;
}
$('#lista').onclick = e => { const b = e.target.closest('.f'); if (!b) return; sel = b.dataset.id; render(); };
$('#lista').ondblclick = e => { if (e.target.closest('.f')) ok(); };
document.querySelectorAll('.abas button').forEach(b => b.onclick = () => { aba = b.dataset.t; document.querySelectorAll('.abas button').forEach(x => x.classList.toggle('on', x === b)); render(); });
const ok = () => sel && seletor.fim({ id: sel, som: $('#som').checked });
$('#ok').onclick = ok;
$('#cancelar').onclick = () => seletor.fim(null);
addEventListener('keydown', e => { if (e.key === 'Escape') seletor.fim(null); if (e.key === 'Enter') ok(); });
seletor.aoReceber(l => {
  L = l;
  // DayZ aberto já vem selecionado
  const dz = L.find(f => !f.tela && /dayz/i.test(f.nome));
  if (dz) sel = dz.id;
  if (!L.some(f => !f.tela)) aba = 'tela';
  document.querySelectorAll('.abas button').forEach(x => x.classList.toggle('on', x.dataset.t === aba));
  render();
});
</script>
</body></html>
