<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>U.C.B.R</title>
<style>
html,body{margin:0;height:100%}
body{background:radial-gradient(700px 400px at 50% 30%,rgba(255,138,36,.14),transparent 60%),#0b0c0f;color:#f5f5f5;font:15px "Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
img{width:120px;height:120px;filter:drop-shadow(0 0 22px rgba(255,138,36,.45))}
h1{font:400 30px Impact,"Arial Narrow",sans-serif;letter-spacing:1px;margin:14px 0 6px;text-transform:uppercase}
h1 b{color:#ff8a24;font-weight:400}
p{color:#9299a5;margin:4px 0}
button{margin-top:18px;border:0;border-radius:8px;padding:10px 22px;font:700 14px inherit;cursor:pointer;background:linear-gradient(180deg,#ff8a24,#ff6b00);color:#1a0d04}
small{display:block;margin-top:26px;color:#646b78}
</style></head>
<body><div style="position:fixed;top:0;left:0;right:0;height:32px;-webkit-app-region:drag"></div><div>
<img src="build/icon.png" alt="U.C.B.R">
<h1>Sem <b>conexão</b></h1>
<p>Não consegui abrir a plataforma do clã.</p>
<p>Confira a internet. Vou tentar de novo em <b id="s">10</b> s.</p>
<button id="b">Tentar agora</button>
<small>Desenvolvido por Guilherme Azevedo</small>
</div>
<script>
const u = new URLSearchParams(location.search).get('u') || 'https://ucbr.pages.dev/';
const ir = () => { location.href = u.startsWith('https://') ? u : 'https://ucbr.pages.dev/'; };
document.getElementById('b').onclick = ir;
let n = 10; setInterval(() => { n--; document.getElementById('s').textContent = Math.max(n, 0); if (n <= 0) ir(); }, 1000);
</script>
</body></html>
